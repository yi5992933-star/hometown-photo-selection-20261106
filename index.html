const CHAPTERS={1:{title:'一　背井离乡',description:'离开让熟悉的地方变成远方。先看人的迁移、异乡的停留，以及对家与归属的寻找。'},2:{title:'二　触景生情',description:'一张旧照片、一次重复的动作、一处相似的景象，使过去进入现在的生活。'},3:{title:'三　叶落归根',description:'重新面对家人、出生地与土地的变化。回到一个地方，也重新认识与它的关系。'}};
const $=s=>document.querySelector(s);let chosen=new Set();try{chosen=new Set(JSON.parse(localStorage.getItem('hometown-selection-v2')||'[]'))}catch(e){}let filter='china',shown=[],active=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const artists=[...new Set(DATA.map(x=>x.artist))];$('#headlineCount').textContent=DATA.length+' 幅候选图像 / 中国 '+DATA.filter(x=>x.region==='中国').length+' 幅 / '+artists.length+' 位摄影师';artists.forEach(a=>{let op=document.createElement('option');op.value=a;op.textContent=a;$('#artist').append(op)});
function updateSelection(){try{localStorage.setItem('hometown-selection-v2',JSON.stringify([...chosen]))}catch(e){}$('#selectedCount').textContent=chosen.size;document.querySelectorAll('[data-select]').forEach(b=>{const yes=chosen.has(b.dataset.select);b.classList.toggle('chosen',yes);b.textContent=yes?'已加入 ✓':'加入候选 ＋';b.setAttribute('aria-pressed',String(yes))})}
function toggle(id){chosen.has(id)?chosen.delete(id):chosen.add(id);updateSelection();if(filter==='selected')render()}
function render(){const term=$('#search').value.toLocaleLowerCase().trim(),artist=$('#artist').value;shown=DATA.filter(x=>(filter==='all'||filter==='china'&&x.region==='中国'||filter==='selected'&&chosen.has(x.id)||String(x.chapter)===filter)&&(!artist||x.artist===artist)&&(!term||[x.artist,x.title,x.series,x.id].join(' ').toLocaleLowerCase().includes(term)));$('#count').textContent='当前 '+shown.length+' 张 / 全部 '+DATA.length+' 张';$('#gallery').replaceChildren();if(!shown.length){$('#gallery').innerHTML='<p class="empty">这个筛选下暂无作品，请更换条件。</p>';return}for(const c of [1,2,3]){const items=shown.filter(x=>Number(x.chapter)===c);if(!items.length)continue;const sec=document.createElement('section');sec.className='group';sec.innerHTML='<div class="grouphead"><h2>'+CHAPTERS[c].title+'　<span style="font-size:14px;color:var(--muted)">'+items.length+' 张</span></h2><p>'+CHAPTERS[c].description+'</p></div><div class="grid"></div>';for(const x of items){const a=document.createElement('article');a.className='work';a.innerHTML='<button class="imagebutton" data-open="'+x.id+'" aria-label="放大 '+esc(x.artist+' '+x.title)+'"><img loading="lazy" decoding="async" src="'+esc(x.preview)+'" alt="'+esc(x.title)+'"></button><div class="caption"><div class="captionrow"><span class="num">'+x.id+'</span><button class="selectwork" data-select="'+x.id+'" aria-pressed="false">加入候选 ＋</button></div><h3>'+esc(x.artist)+'</h3><div class="series">'+esc(x.series)+(x.medium==='家庭电影静帧'?' · 家庭电影静帧':'')+'<br>'+esc(x.title)+(x.year?'　'+esc(x.year):'')+'</div></div>';sec.querySelector('.grid').append(a)}$('#gallery').append(sec)}updateSelection()}
function openPhoto(id){active=shown.findIndex(x=>x.id===id);if(active<0)return;showActive();if(!$('#viewer').open)$('#viewer').showModal()}
function showActive(){const x=shown[active];$('#position').textContent=x.id+' / '+(active+1)+' of '+shown.length;$('#full').src=x.preview;$('#full').alt=x.artist+' '+x.title;$('#details').innerHTML='<p class="label">'+esc(CHAPTERS[x.chapter].title)+'</p><h2>'+esc(x.artist)+'</h2><p>'+esc(x.series)+(x.medium==='家庭电影静帧'?' · 家庭电影静帧':'')+'<br>'+esc(x.title)+(x.year?'<br>'+esc(x.year):'')+'</p><p class="label">与故乡主题的联系</p><p>'+esc(x.reason_cn)+'</p><p><a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">打开作品来源 ↗</a></p><button class="plain selectwork" data-select="'+x.id+'"></button><div class="arrows"><button class="plain" data-direction="-1">上一张</button><button class="plain" data-direction="1">下一张</button></div>';updateSelection()}
document.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel){toggle(sel.dataset.select);return}const op=e.target.closest('[data-open]');if(op){openPhoto(op.dataset.open);return}const dr=e.target.closest('[data-direction]');if(dr){active=(active+Number(dr.dataset.direction)+shown.length)%shown.length;showActive()}});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()}));$('#artist').addEventListener('change',render);$('#search').addEventListener('input',render);$('#close').addEventListener('click',()=>$('#viewer').close());document.addEventListener('keydown',e=>{if($('#viewer').open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();active=(active+(e.key==='ArrowLeft'?-1:1)+shown.length)%shown.length;showActive()}});$('#copy').addEventListener('click',async()=>{const t=DATA.filter(x=>chosen.has(x.id)).map(x=>x.id+' '+x.artist+' '+x.title).join('\n');try{await navigator.clipboard.writeText(t);$('#copy').textContent=t?'已复制 ✓':'请先选择照片'}catch(e){$('#copy').textContent='请用右侧导出按钮'}setTimeout(()=>$('#copy').textContent='复制所选编号',2000)});$('#export').addEventListener('click',()=>{const rows=DATA.filter(x=>chosen.has(x.id));const text='故乡 摄影候选清单\n\n'+rows.map(x=>x.id+'　'+x.artist+'　'+x.series+'　'+x.title+'\n'+x.source_url).join('\n\n');const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='故乡_已选作品编号.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)});render();
</script>
